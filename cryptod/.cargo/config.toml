# Per-target linker configuration for cross-compilation.
# The Docker builder ships aarch64-linux-gnu-gcc; we point cargo at it.

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
# Critical: enable ARMv8 Crypto Extensions for the RustCrypto `aes` and
# `sha2` crates. Without `+aes` the `aes-gcm` crate falls back to a
# bitsliced software implementation that runs ~10× slower than hardware
# AES on Cortex-A53 (measured 117 Mbps vs 1301 Mbps for 1KB blocks).
#
# Cortex-A53 (Marvell Armada 3720, our target ISM4120I) supports aes,
# pmull, sha1, sha2 per `/proc/cpuinfo` Features, so this is safe.
rustflags = [
  "-C", "target-feature=+aes,+sha2,+neon",
]

# Useful aliases. Run e.g. `cargo arm-build` inside the container.
[alias]
arm-build = "build --release --target aarch64-unknown-linux-gnu"
arm-check = "check --target aarch64-unknown-linux-gnu"
arm-clippy = "clippy --target aarch64-unknown-linux-gnu --all-targets -- -D warnings"
