# Rust workspace for ACM-UZ crypto datapath.
#
# Builds for aarch64-unknown-linux-gnu target. Cross-compilation linker is
# provided by the Docker builder image (aarch64-linux-gnu-gcc).

[workspace]
resolver = "2"
members = [
    "crates/acm-cryptod",
    "crates/acm-crypto",
    "crates/acm-wire",
    "crates/acm-ipc",
    "crates/acm-dpdk",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
repository = "https://github.com/zolotaevdmitriy-droid/smartsfp"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Release profile tuned for embedded deployment: optimize for size + speed,
# strip debug info from the final binary (kept in target/.../debug/ for
# crash analysis via debuginfod or saved-symbols).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = false
