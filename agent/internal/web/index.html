<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ACM-UZ Agent</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
           background: #0f1419; color: #d9e0e6; margin: 0; padding: 24px;
           font-size: 14px; }
    h1 { font-size: 18px; margin: 0 0 16px 0; color: #6cb4ff; }
    .card { background: #1a2028; border: 1px solid #2a3540; border-radius: 6px;
            padding: 18px 24px; max-width: 720px; margin: 0 auto 16px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #2a3540; }
    th { color: #8b95a3; font-weight: 500; width: 38%; }
    td.value { font-family: ui-monospace, "Cascadia Code", Menlo, monospace; }
    .badge-ok { color: #4ade80; }
    .badge-err { color: #f87171; }
    .badge-warn { color: #facc15; }
    form { display: grid; grid-template-columns: max-content 1fr; gap: 10px 14px;
           align-items: center; margin-top: 8px; }
    label { color: #8b95a3; }
    input, select, button { background: #0f1419; color: #d9e0e6;
                            border: 1px solid #2a3540; border-radius: 4px;
                            padding: 6px 10px; font-size: 13px;
                            font-family: ui-monospace, monospace; }
    button { cursor: pointer; background: #1e3a5f; border-color: #3b6ea5; color: #fff; }
    button:hover { background: #2a4f7e; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #rotate-result { grid-column: span 2; min-height: 1.5em; }
    .meta { color: #6b7785; font-size: 11px; text-align: center; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>cryptod status</h1>
    <table id="status-table">
      <tbody>
        <tr><th>Connection</th>             <td class="value" id="conn">loading…</td></tr>
        <tr><th>Version</th>                 <td class="value" id="version">—</td></tr>
        <tr><th>Uptime</th>                  <td class="value" id="uptime">—</td></tr>
        <tr><th>Active provider</th>         <td class="value" id="provider">—</td></tr>
        <tr><th>Active key ID</th>           <td class="value" id="keyid">—</td></tr>
        <tr><th>Packets sealed</th>          <td class="value" id="sealed">—</td></tr>
        <tr><th>Packets opened</th>          <td class="value" id="opened">—</td></tr>
        <tr><th>Crypto errors</th>           <td class="value" id="errors">—</td></tr>
      </tbody>
    </table>
  </div>

  <div class="card">
    <h1>rotate key</h1>
    <form id="rotate-form">
      <label for="key-id">Key ID</label>
      <input type="number" id="key-id" name="key_id" value="1" min="0" required />

      <label for="algo">Algorithm</label>
      <select id="algo" name="algo">
        <option value="1">0x01 — AES-128-GCM (16 B key)</option>
        <option value="2" selected>0x02 — AES-256-GCM (32 B key)</option>
        <option value="16">0x10 — O'z DSt 1105 (not yet)</option>
      </select>

      <label for="material">Material (hex)</label>
      <input type="text" id="material" name="material_hex"
             placeholder="64 hex chars for AES-256-GCM" required />

      <span></span>
      <span>
        <button type="button" id="random-key">Random</button>
        <button type="submit">Rotate</button>
      </span>

      <div id="rotate-result"></div>
    </form>
  </div>

  <div class="meta">
    /metrics for Prometheus · /api/v1/status JSON · /healthz · /readyz
  </div>

<script>
async function refreshStatus() {
  try {
    const r = await fetch("/api/v1/status", { cache: "no-store" });
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      document.getElementById("conn").innerHTML =
        '<span class="badge-err">DOWN</span> ' + (e.error || r.statusText);
      return;
    }
    const s = await r.json();
    document.getElementById("conn").innerHTML =
        s.running
            ? '<span class="badge-ok">UP</span>'
            : '<span class="badge-warn">STOPPED</span>';
    document.getElementById("version").textContent  = s.version;
    document.getElementById("uptime").textContent   = fmtDuration(s.uptime_s);
    document.getElementById("provider").textContent = s.active_provider;
    document.getElementById("keyid").textContent    =
        s.active_key_id == null ? "(none)" : s.active_key_id;
    document.getElementById("sealed").textContent   = s.packets_sealed.toLocaleString();
    document.getElementById("opened").textContent   = s.packets_opened.toLocaleString();
    const errs = document.getElementById("errors");
    errs.textContent = s.crypto_errors.toLocaleString();
    errs.className = "value " + (s.crypto_errors > 0 ? "badge-warn" : "");
  } catch (e) {
    document.getElementById("conn").innerHTML =
      '<span class="badge-err">DOWN</span> ' + e.message;
  }
}

function fmtDuration(sec) {
  const h = Math.floor(sec / 3600);
  const m = Math.floor((sec % 3600) / 60);
  const s = sec % 60;
  return `${h}h ${m}m ${s}s`;
}

document.getElementById("random-key").onclick = () => {
  const algo = +document.getElementById("algo").value;
  const len = algo === 1 ? 16 : 32;
  const buf = new Uint8Array(len);
  crypto.getRandomValues(buf);
  document.getElementById("material").value =
    Array.from(buf, b => b.toString(16).padStart(2, "0")).join("");
};

document.getElementById("rotate-form").onsubmit = async (ev) => {
  ev.preventDefault();
  const out = document.getElementById("rotate-result");
  out.innerHTML = "…";
  const body = {
    key_id:       +document.getElementById("key-id").value,
    algo:         +document.getElementById("algo").value,
    material_hex: document.getElementById("material").value.trim(),
  };
  try {
    const r = await fetch("/api/v1/keys/rotate", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const j = await r.json();
    if (r.ok) {
      out.innerHTML = '<span class="badge-ok">ok</span>';
      refreshStatus();
    } else {
      out.innerHTML = '<span class="badge-err">' + (j.error || r.statusText) + '</span>';
    }
  } catch (e) {
    out.innerHTML = '<span class="badge-err">' + e.message + '</span>';
  }
};

refreshStatus();
setInterval(refreshStatus, 3000);
</script>
</body>
</html>
